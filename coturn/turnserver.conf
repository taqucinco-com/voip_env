# STUN/TURNの待受ポート
listening-port=3478

# コンテナ内部では全インターフェースで待ち受ける
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# メディア中継用のポート範囲（開発検証用に小さめのレンジ）
# 本番では同時通話数に応じて広げ、コンテナのports設定も合わせて変更すること
min-port=40000
max-port=40040

# シグナリングサーバー発行の時限トークン（REST API認証）を使う
# static-auth-secret 自体は秘密情報のため docker-compose 側から
# --static-auth-secret 引数で渡す（このファイルには書かない）
use-auth-secret
realm=voip.local

# ローカル/LAN検証用。インターネット経由で公開する場合は
# サーバーのグローバルIPをここに設定する
# external-ip=<public-ip>

no-cli
log-file=stdout
